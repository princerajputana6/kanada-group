name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          set +e
          pnpm install 2>&1 | tee /tmp/install.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::pnpm install failed (exit $code): $(tail -c 3000 /tmp/install.log | tr '\n' ' ')"
            exit $code
          fi

      - name: Build web app for Cloudflare
        run: pnpm --filter web exec opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
