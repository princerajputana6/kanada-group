name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Build web app for Cloudflare
        run: pnpm --filter web exec opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        shell: bash
        run: |
          set +e
          pnpm --filter web exec wrangler deploy 2>&1 | tee /tmp/deploy.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::wrangler deploy failed (exit $code): $(tail -c 3000 /tmp/deploy.log | tr '\n' ' ')"
            exit $code
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
